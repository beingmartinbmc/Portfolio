<footer class="footer-section">
  <div class="footer-ground play-only">
    <div class="ground-grass"></div>
    <div class="ground-brick"></div>
  </div>

  <div class="footer-bar">
    <div class="footer-left">
      <img src="assets/images/mario-sprite.png" alt="" class="footer-mario play-only" loading="lazy" decoding="async" width="32" height="32" />
      <span class="footer-text">
        © {{ currentYear }} <strong>Ankit Sharma</strong><span class="play-only"> · <span class="game-tag">GAME NEVER OVER</span></span>
      </span>
    </div>

    <nav class="footer-links" aria-label="Documents and contact">
      <a [href]="documentLinks.resume" target="_blank" rel="noopener">Resume</a>
      <a [href]="documentLinks.coverLetter" target="_blank" rel="noopener">Cover letter</a>
      <a [href]="'mailto:' + contactLinks.email">Email</a>
      <a [href]="socialLinks.linkedin" target="_blank" rel="noopener">LinkedIn</a>
      <a [href]="socialLinks.github" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</footer>
