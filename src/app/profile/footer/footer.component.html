<footer class="footer-section">
  <div class="footer-ground">
    <div class="ground-grass"></div>
    <div class="ground-brick"></div>
  </div>

  <div class="footer-bar">
    <div class="footer-left">
      <img src="assets/images/mario-sprite.png" alt="Mario" class="footer-mario" />
      <span class="footer-text">
        Made by <strong>Ankit</strong> with ❤️ · {{ currentYear }} · <span class="game-tag">GAME NEVER OVER</span>
      </span>
    </div>

    <a [href]="analyticsLinks.flagCounterPage" target="_blank" rel="noopener" class="analytics-pill">
      <span class="pill-dot"></span>
      <span>Analytics</span>
    </a>
  </div>
</footer>
