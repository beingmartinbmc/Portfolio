<a class="skip-link" href="#main-content">Skip to main content</a>
<app-header></app-header>

<main class="portfolio-shell" id="main-content" tabindex="-1">
  <app-intro></app-intro>

  <div class="page-content">
    <app-about></app-about>
    <app-experience></app-experience>
    <app-metrics-dashboard></app-metrics-dashboard>
    <app-publications></app-publications>
    <app-skills></app-skills>
    <app-blog></app-blog>
    <!-- Section ids live on these wrappers so anchors and the mini-map survive @defer swapping its content. -->
    <div id="avatar-3d">
      <!-- The twin pulls ~3.6 MB (three.js + model). Its code is prefetched once the browser is idle, so it mounts as soon as it scrolls into view. No click-to-load banner. -->
      @defer (on viewport; prefetch on idle) {
        <app-avatar-3d></app-avatar-3d>
      } @placeholder {
        <section class="deferred-section-placeholder apple-section" aria-label="AI twin loads when visible"></section>
      }
    </div>
    <app-education></app-education>
    <app-contact></app-contact>
    <div id="ai-quiz-game">
      @defer (on viewport) {
        <app-ai-quiz-game></app-ai-quiz-game>
      } @placeholder {
        <section class="deferred-section-placeholder apple-section" aria-label="AI game loads when visible">
          <div class="apple-container">AI game ready to load</div>
        </section>
      }
    </div>
  </div>
</main>

<app-footer></app-footer>
