<header class="site-header" [class.scrolled]="isScrolled" role="banner">
  <nav class="site-nav apple-container" aria-label="Main navigation">
    <a href="#top" class="brand" (click)="onNavLinkClick($event)">
      <span class="brand-mark">&lbrace;&rbrace;</span>
      <span class="brand-copy">
        <span class="brand-name">Ankit Sharma</span>
        <span class="brand-role">Senior Backend Engineer</span>
      </span>
    </a>

    <div class="nav-links" [class.active]="isMenuOpen">
      @for (link of navLinks; track link.id) {
        <a
          class="nav-link"
          [href]="'#' + link.id"
          [class.is-current]="activeSection === link.id"
          [attr.aria-current]="activeSection === link.id ? 'true' : null"
          (click)="onNavLinkClick($event, link.id)">{{ link.label }}</a>
      }
    </div>

    <div class="nav-actions">
      <div class="status-pill">&#x2605; Open to conversations</div>
      <button
        type="button"
        class="play-toggle"
        aria-label="Play mode"
        [attr.aria-pressed]="playMode.enabled()"
        [title]="playMode.enabled() ? 'Play mode is on: XP, achievements and sounds' : 'Play mode: turn on the game layer'"
        (click)="playMode.toggle()">
        <span aria-hidden="true">🎮</span>
      </button>
    </div>

    <button
      class="mobile-menu-btn"
      (click)="toggleMenu()"
      [class.active]="isMenuOpen"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation menu"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </nav>

  @if (playMode.enabled()) {
    <!-- XP Progress Bar -->
    <div class="xp-bar-container" [class.visible]="isScrolled">
      <div class="xp-bar-track">
        <div class="xp-bar-fill" [style.width.%]="xpPercent"></div>
      </div>
      <span class="xp-level-label">LVL {{ levelNum }} · {{ levelTitle }}</span>
    </div>
  }
</header>
