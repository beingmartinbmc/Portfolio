<header class="site-header" [class.scrolled]="isScrolled" role="banner">
  <nav class="site-nav apple-container" aria-label="Main navigation">
    <a href="#top" class="brand" (click)="onNavLinkClick($event)">
      <span class="brand-mark">&lbrace;&rbrace;</span>
      <span class="brand-copy">
        <span class="brand-name">Ankit Sharma</span>
        <span class="brand-role">Senior Backend Engineer</span>
      </span>
    </a>

    <div class="nav-links" [class.active]="isMenuOpen">
      <a href="#about" class="nav-link" [class.is-current]="activeSection === 'about'" [attr.aria-current]="activeSection === 'about' ? 'true' : null" (click)="onNavLinkClick($event, 'about')">About</a>
      <a href="#experience" class="nav-link" [class.is-current]="activeSection === 'experience'" [attr.aria-current]="activeSection === 'experience' ? 'true' : null" (click)="onNavLinkClick($event, 'experience')">Work</a>
      <a href="#publications" class="nav-link" [class.is-current]="activeSection === 'publications'" [attr.aria-current]="activeSection === 'publications' ? 'true' : null" (click)="onNavLinkClick($event, 'publications')">Projects</a>
      <a href="#skill" class="nav-link" [class.is-current]="activeSection === 'skill'" [attr.aria-current]="activeSection === 'skill' ? 'true' : null" (click)="onNavLinkClick($event, 'skill')">Skills</a>
      <a href="#blogs" class="nav-link" [class.is-current]="activeSection === 'blogs'" [attr.aria-current]="activeSection === 'blogs' ? 'true' : null" (click)="onNavLinkClick($event, 'blogs')">Writing</a>
      <a href="#avatar-3d" class="nav-link" [class.is-current]="activeSection === 'avatar-3d'" [attr.aria-current]="activeSection === 'avatar-3d' ? 'true' : null" (click)="onNavLinkClick($event, 'avatar-3d')">AI Twin</a>
      <a href="#operating-style" class="nav-link" [class.is-current]="activeSection === 'operating-style'" [attr.aria-current]="activeSection === 'operating-style' ? 'true' : null" (click)="onNavLinkClick($event, 'operating-style')">Approach</a>
      <a href="#ai-quiz-game" class="nav-link" [class.is-current]="activeSection === 'ai-quiz-game'" [attr.aria-current]="activeSection === 'ai-quiz-game' ? 'true' : null" (click)="onNavLinkClick($event, 'ai-quiz-game')">Game</a>
    </div>

    <div class="nav-actions">
      <div class="status-pill">&#x2605; Open to conversations</div>
      <button
        type="button"
        class="play-toggle"
        aria-label="Play mode"
        [attr.aria-pressed]="playMode.enabled()"
        [title]="playMode.enabled() ? 'Play mode is on: XP, achievements and sounds' : 'Play mode: turn on the game layer'"
        (click)="playMode.toggle()">
        <span aria-hidden="true">🎮</span>
      </button>
    </div>

    <button
      class="mobile-menu-btn"
      (click)="toggleMenu()"
      [class.active]="isMenuOpen"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation menu"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </nav>

  @if (playMode.enabled()) {
    <!-- XP Progress Bar -->
    <div class="xp-bar-container" [class.visible]="isScrolled">
      <div class="xp-bar-track">
        <div class="xp-bar-fill" [style.width.%]="xpPercent"></div>
      </div>
      <span class="xp-level-label">LVL {{ levelNum }} · {{ levelTitle }}</span>
    </div>
  }
</header>
