<header class="apple-header" [class.scrolled]="isScrolled" role="banner">
  <nav class="apple-nav" aria-label="Main navigation">
    <div class="apple-container">
      <div class="nav-content">
        <!-- Logo -->
        <div class="nav-logo">
          <a href="#" class="logo-link">
            <span class="logo-text">Ankit Sharma</span>
          </a>
        </div>
        
        <!-- Navigation Links -->
        <div class="nav-links" [class.active]="isMenuOpen">
          <a href="#about" class="nav-link smooth-scroll" (click)="onNavLinkClick()">
            <span class="link-text">About</span>
          </a>
          <a href="#experience" class="nav-link smooth-scroll" (click)="onNavLinkClick()">
            <span class="link-text">Experience</span>
          </a>
          <a href="#publications" class="nav-link smooth-scroll" (click)="onNavLinkClick()">
            <span class="link-text">Projects</span>
          </a>
          <a href="#blogs" class="nav-link smooth-scroll" (click)="onNavLinkClick()">
            <span class="link-text">Blogs</span>
          </a>
          <a href="#open-source" class="nav-link smooth-scroll" (click)="onNavLinkClick()">
            <span class="link-text">Open Source</span>
          </a>
          <a href="#skill" class="nav-link smooth-scroll" (click)="onNavLinkClick()">
            <span class="link-text">Skills</span>
          </a>
                    <a href="#ai-quiz-game" class="nav-link smooth-scroll" (click)="onNavLinkClick()">
            <span class="link-text">AI Quiz</span>
          </a>
          <a href="#education" class="nav-link smooth-scroll" (click)="onNavLinkClick()">
            <span class="link-text">Education</span>
          </a>
          <a href="#contact" class="nav-link smooth-scroll" (click)="onNavLinkClick()">
            <span class="link-text">Contact</span>
          </a>
        </div>
        
        <!-- Music Controls -->
        <div class="music-controls">
          <!-- Music Toggle -->
          <button class="music-toggle" (click)="toggleMusic()" [class.playing]="isPlaying"
            [attr.aria-pressed]="isPlaying" aria-label="Toggle background music">
            <span class="music-emoji">🎵</span>
          </button>
          
          <!-- Audio Visualizer -->
          <div class="audio-visualizer" [class.active]="isPlaying">
            <canvas #audioCanvas class="visualizer-canvas" width="120" height="40"></canvas>
          </div>
        </div>
        
        <!-- Mobile Menu Button -->
        <button class="mobile-menu-btn" (click)="toggleMenu()" [class.active]="isMenuOpen"
          [attr.aria-expanded]="isMenuOpen" aria-label="Toggle navigation menu">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </div>
  </nav>
</header>
